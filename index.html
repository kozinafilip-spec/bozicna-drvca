<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Božićna drvca</title>
<style>
  :root { --zelena:#1f5130; --svijetla:#eef4ee; --tekst:#1c2a20; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--svijetla); color:var(--tekst); }
  header { background:var(--zelena); color:#fff; padding:20px 16px; text-align:center; }
  header h1 { margin:0 0 6px; font-size:1.5rem; }
  header p { margin:0; opacity:.9; font-size:.95rem; }
  #brojac { margin:14px 16px 0; text-align:center; font-weight:600; }
  #info { width:calc(100% - 32px); max-width:1068px; margin:14px auto 0; padding:12px 16px; background:#fff; border-left:5px solid var(--zelena); border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12); line-height:1.6; display:none; }
  #info a { color:var(--zelena); font-weight:700; text-decoration:none; white-space:nowrap; }
  .sekcija h2 { max-width:1100px; margin:26px auto 0; padding:0 16px; font-size:1.3rem; color:var(--zelena); border-bottom:2px solid #c3d5c5; }
  .mreza { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:16px; max-width:1100px; margin:0 auto; }
  .kartica { background:#fff; border-radius:10px; overflow:hidden; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .kartica .slika { aspect-ratio:3/4; background:#cfdccf; display:flex; align-items:center; justify-content:center; font-size:2.2rem; color:#5d7a63; }
  .kartica img { width:100%; height:100%; object-fit:cover; display:block; }
  .kartica .broj { padding:8px 8px 2px; text-align:center; font-weight:700; }
  .kartica .opis { padding:0 8px 10px; text-align:center; font-size:.82rem; color:#4a5f4f; line-height:1.35; }
  .kartica .opis b { color:var(--zelena); font-size:.95rem; }
  #opis { color:#dfe9e0; text-align:center; margin:0 0 16px; font-size:1.05rem; }
  #opis b { color:#fff; font-size:1.25rem; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; overflow:auto; z-index:10; padding:16px; }
  #overlay.otvoren { display:block; }
  #overlay h2 { color:#fff; text-align:center; margin:8px 0 14px; }
  #zatvori { position:fixed; top:10px; right:14px; background:#fff; border:0; border-radius:20px; padding:8px 14px; font-size:1rem; cursor:pointer; z-index:11; }
  #slike { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; max-width:1100px; margin:0 auto; }
  #slike .slika { background:#3a4a3d; min-height:200px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#9db3a1; }
  #slike img { width:100%; display:block; }
  #upit { color:#fff; text-align:center; margin:18px 0 40px; font-size:1.05rem; }
  #prazno { text-align:center; padding:40px 16px; display:none; }
</style>
</head>
<body>
<header>
  <h1>🎄 Božićna drvca</h1>
  <p>Klikni na drvce da vidiš sve slike. Sviđa ti se? Javi mi broj na Teamsu.</p>
</header>
<div id="info"></div>
<div id="brojac"></div>
<div id="sekcije"></div>
<p id="prazno">Sva drvca su već rezervirana. 🎄</p>

<div id="overlay">
  <button id="zatvori">Zatvori ✕</button>
  <h2 id="naslov"></h2>
  <p id="opis"></p>
  <div id="slike"></div>
  <p id="upit"></p>
</div>

<script>
// Popis slika (popis.js), rezervirana drvca (rezervirano.js) i podaci o drvcima
// (podaci.js: visina, širina, cijena) učitavaju se uvijek svježe.
function ucitaj(src) {
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = src + '?t=' + Date.now();
    s.onload = s.onerror = res;
    document.head.appendChild(s);
  });
}

Promise.all([ucitaj('popis.js'), ucitaj('rezervirano.js'), ucitaj('podaci.js'), ucitaj('postavke.js')]).then(() => {
  const borovi = window.BOROVI || {};
  const podaci = window.PODACI || {};
  const postavke = window.POSTAVKE || {};

  // Info okvir: dostava i telefon (retci bez podatka se preskaču).
  const info = document.getElementById('info');
  const dodajRedak = (emoji, tekst, telefon) => {
    const r = document.createElement('div');
    r.append(`${emoji} ${tekst}`);
    if (telefon) {
      const a = document.createElement('a');
      a.href = 'tel:' + telefon.replace(/[^\d+]/g, '');
      a.textContent = telefon;
      r.append(' ', a);
    }
    info.appendChild(r);
  };
  if (!prazno0(postavke.dostava)) dodajRedak('🚚', `Drvca dostavljam ${postavke.dostava}`);
  if (!prazno0(postavke.telefon)) dodajRedak('📞', 'Za sva pitanja slobodno me nazovi na broj', postavke.telefon);
  if (info.children.length) info.style.display = 'block';

  function prazno0(v) { return v === undefined || v === null || String(v).trim() === ''; }

  // Broj dobije jedinicu (180 -> "180 cm"), a tekst ostaje kakav je ("oko 2 m").
  const jeBroj = v => typeof v === 'number' || (typeof v === 'string' && /^\s*\d+([.,]\d+)?\s*$/.test(v));
  const prazno = v => v === undefined || v === null || String(v).trim() === '';
  const mjera = (v, jedinica) => prazno(v) ? '' : (jeBroj(v) ? `${String(v).trim()} ${jedinica}` : String(v));
  const cijena = v => prazno(v) ? '' : (jeBroj(v) ? `${String(v).trim()} €` : String(v));

  // Vraća HTML s visinom, širinom i cijenom; prazna polja se preskaču.
  function opisHtml(n) {
    const p = podaci[n] || {};
    const dijelovi = [];
    const vis = mjera(p.visina, 'cm'), sir = mjera(p.sirina, 'cm'), cij = cijena(p.cijena);
    if (vis) dijelovi.push(`visina ${vis}`);
    if (sir) dijelovi.push(`širina ${sir}`);
    let html = dijelovi.join(' · ');
    if (cij) html += (html ? '<br>' : '') + `<b>${cij}</b>`;
    return html;
  }
  const rez = (window.REZERVIRANI || []).map(Number);
  const svi = Object.keys(borovi).map(Number).sort((a, b) => a - b);
  const slobodni = svi.filter(n => !rez.includes(n));

  document.getElementById('brojac').textContent =
    `Slobodno još ${slobodni.length} od ${svi.length} drvaca`;
  if (!slobodni.length) document.getElementById('prazno').style.display = 'block';

  const slikaEl = (src, n, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'slika';
    wrap.textContent = i === 1 ? n : '…';
    const img = new Image();
    img.alt = `Drvce ${n}, slika ${i}`;
    img.onload = () => { wrap.textContent = ''; wrap.appendChild(img); };
    img.src = src;
    return wrap;
  };

  // Rezani borići su svi do broja "kopaniOd" (iz postavke.js), kopani od tog broja nadalje.
  const kopaniOd = prazno0(postavke.kopaniOd) ? Infinity : Number(postavke.kopaniOd);
  const sekcije = document.getElementById('sekcije');
  [
    { naslov: 'Rezani borići', popis: slobodni.filter(n => n < kopaniOd) },
    { naslov: 'Kopani borići', popis: slobodni.filter(n => n >= kopaniOd) },
  ].forEach(sek => {
    if (!sek.popis.length) return;
    const wrap = document.createElement('section');
    wrap.className = 'sekcija';
    const h = document.createElement('h2');
    h.textContent = sek.naslov;
    const mreza = document.createElement('div');
    mreza.className = 'mreza';
    wrap.append(h, mreza);
    sekcije.appendChild(wrap);
    sek.popis.forEach(n => dodajKarticu(n, mreza));
  });

  function dodajKarticu(n, mreza) {
    const k = document.createElement('div');
    k.className = 'kartica';
    const b = document.createElement('div');
    b.className = 'broj';
    b.textContent = `Drvce ${n}`;
    k.append(slikaEl(borovi[n][0], n, 1), b);
    const o = opisHtml(n);
    if (o) {
      const d = document.createElement('div');
      d.className = 'opis';
      d.innerHTML = o;
      k.appendChild(d);
    }
    k.onclick = () => otvori(n);
    mreza.appendChild(k);
  }

  const overlay = document.getElementById('overlay');
  function otvori(n) {
    document.getElementById('naslov').textContent = `Drvce broj ${n}`;
    document.getElementById('opis').innerHTML = opisHtml(n);
    const c = document.getElementById('slike');
    c.textContent = '';
    borovi[n].forEach((src, idx) => c.appendChild(slikaEl(src, n, idx + 1)));
    document.getElementById('upit').textContent = `Sviđa ti se? Javi broj ${n} na Teamsu.`;
    overlay.classList.add('otvoren');
    overlay.scrollTop = 0;
  }
  const zatvori = () => overlay.classList.remove('otvoren');
  document.getElementById('zatvori').onclick = zatvori;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') zatvori(); });
});
</script>
</body>
</html>
